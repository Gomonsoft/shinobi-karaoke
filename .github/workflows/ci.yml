name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

# Versión de uv fijada en un único sitio (también en app/README.md y worker/uv.lock).
env:
  UV_VERSION: '0.13.7'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: app (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: app/.nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json

      # uv + dependencias del worker: sin esto los tests de integración con el worker
      # real (worker.test.ts, gestor.integracion.test.ts) se omiten.
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: worker/uv.lock
      - name: Dependencias del worker (uv sync --locked)
        working-directory: worker
        run: uv sync --locked

      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm audit --omit=dev --audit-level=high
      - run: npm test -- --reporter=verbose

      # E2E de Playwright (_electron): al menos en Linux, con pantalla virtual.
      - name: Permitir el sandbox de Electron (Ubuntu 24.04+)
        if: runner.os == 'Linux'
        working-directory: .
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: E2E (Playwright, xvfb)
        if: runner.os == 'Linux'
        # Las ventanas Electron comparten el puntero de Xvfb: aislar las pruebas evita
        # que la interacción de una detenga la cuenta atrás del reproductor en otra.
        run: xvfb-run --auto-servernum -s "-screen 0 3840x2160x24" npm run test:e2e -- --workers=1

  worker:
    name: worker (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: worker/uv.lock

      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pytest
      # Requisitos bloqueados por perfil al día (ADR 0009 §1): solo resuelve, sin descargar ruedas.
      - run: uv run python scripts/compilar_requisitos.py --comprobar
      # Separación sin ffmpeg en el PATH (tarea 0062; ADR 0004, preguntas/0009 punto 4). Los runners traen
      # ffmpeg: `sin_ffmpeg.py` lo quita del PATH y falla si sigue visible. Sin el extra `separacion`
      # (ni PyTorch ni modelos): la separación usa un audio-separator de prueba (contrato) y el doble.
      - name: Separación sin ffmpeg en el PATH
        shell: bash
        run: |
          uv run python scripts/sin_ffmpeg.py uv run pytest tests/test_separacion_contrato.py tests/test_separar*.py -v
          uv run python -c "import importlib.util,sys; sys.exit(importlib.util.find_spec('torch') is not None)"
