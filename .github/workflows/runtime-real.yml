name: Runtime real (manual)

# Instalación real del runtime con red en los tres SO (tarea 0040). Solo manual: NO se ejecuta en push ni en PR.
on:
  workflow_dispatch:
    inputs:
      perfil:
        description: "Perfil esperado (auto = cpu en Windows/Linux, mps en macOS; falla si el equipo resuelve otro)"
        type: choice
        default: auto
        options: [auto, cpu, cuda, mps]
      modelo:
        description: "Modelo a instalar (calidad por defecto; rapido prueba la vía con consentimiento de la tarea 0057)"
        type: choice
        default: calidad
        options: [calidad, rapido]

permissions:
  contents: read

env:
  UV_VERSION: "0.13.7"

jobs:
  runtime:
    name: runtime (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: app/.nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false

      - name: Dependencias de la app
        working-directory: app
        run: npm ci

      # El gestor real (0034) con SHINOBI_DATOS temporal; el script quita ffmpeg del PATH, instala motor,
      # componentes, diagnóstico y modelo (Calidad), mide el tráfico de red y el pico de disco (0058) y
      # ejecuta demo y diagnostico con el lanzador de producción. Falla si pico + 0,5 GB > espacio_requerido.
      - name: Instalar el runtime y medir
        working-directory: app
        env:
          SHINOBI_DATOS: ${{ runner.temp }}/shinobi-datos
        run: >
          node --experimental-transform-types --disable-warning=ExperimentalWarning
          --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/instalar-runtime.mjs
          --perfil "${{ inputs.perfil }}" --modelo "${{ inputs.modelo }}" --salida "${{ runner.temp }}/runtime-real-${{ matrix.os }}.json"

      # El extra `separacion` instala PyTorch y audio-separator: pruebas con red y pesadas del worker.
      # Los `pesado` (0061/0062) usan el modelo Calidad que acaba de instalar el gestor
      # (SHINOBI_MODELOS_DIR) y corren sin ffmpeg en el PATH (`sin_ffmpeg.py` falla si sigue visible).
      - name: Pruebas con red del worker
        working-directory: worker
        env:
          SHINOBI_TESTS_RED: "1"
        run: |
          uv sync --locked --extra separacion
          uv run pytest -m red -v

      - name: Pruebas pesadas del worker (sin ffmpeg en el PATH)
        working-directory: worker
        env:
          SHINOBI_MODELOS_DIR: ${{ runner.temp }}/shinobi-datos/modelos
        run: uv run python scripts/sin_ffmpeg.py uv run pytest -m pesado -v

      # Opcional (0089): contrato con LRCLIB real (máx. 8 peticiones en total, 250 ms entre ellas). Su fallo
      # no hace fallar el workflow. Las letras recibidas no se guardan.
      - name: Prueba opcional con LRCLIB real (Vitest)
        continue-on-error: true
        working-directory: app
        env:
          SHINOBI_TESTS_RED: "1"
        run: npx vitest run lrclib.red

      - name: Prueba opcional con LRCLIB real (E2E)
        if: runner.os != 'Linux'
        continue-on-error: true
        working-directory: app
        env:
          SHINOBI_TESTS_RED: "1"
        run: npm run build && npx playwright test letras-red

      - name: Prueba opcional con LRCLIB real (E2E, xvfb)
        if: runner.os == 'Linux'
        continue-on-error: true
        working-directory: app
        env:
          SHINOBI_TESTS_RED: "1"
        run: npm run build && xvfb-run --auto-servernum npx playwright test letras-red

      - name: Artefacto con las mediciones
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: runtime-real-${{ matrix.os }}
          path: ${{ runner.temp }}/runtime-real-${{ matrix.os }}.json
          if-no-files-found: warn

  licencia-ffmpeg-av:
    name: licencia del FFmpeg de PyAV y bytes de descarga (5 requisitos)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Descarga las ruedas `av` sin instalarlas; falla con --enable-nonfree o bibliotecas no libres.
      - name: Inspeccionar las ruedas de av
        run: python worker/scripts/inspeccionar_av.py --json "${{ runner.temp }}/licencia-av.json"
      - name: Artefacto con el resultado por plataforma
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: licencia-ffmpeg-av
          path: ${{ runner.temp }}/licencia-av.json
          if-no-files-found: warn

      # Bytes de descarga de cada archivo de requisitos, sin instalar nada (tarea 0058): suma del tamaño
      # de la rueda compatible de cada paquete. Falla si algún paquete queda sin tamaño.
      - name: Instalar packaging
        if: always()
        run: python -m pip install --disable-pip-version-check packaging
      - name: Medir los bytes de descarga de las ruedas
        if: always()
        run: python worker/scripts/medir_descarga.py --json "${{ runner.temp }}/descarga-ruedas.json"
      - name: Artefacto con los bytes de descarga
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: descarga-ruedas
          path: ${{ runner.temp }}/descarga-ruedas.json
          if-no-files-found: warn
