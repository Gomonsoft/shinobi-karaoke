<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>PoC 0019 · render por índice de fotograma</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
  /* Aproximación de PantallaLetra: degradado, unidades cqh, sombra, barrido con clip-path */
  .raiz {
    position: relative; container-type: size; width: 100%; height: 100%; overflow: hidden;
    background: linear-gradient(var(--angulo, 135deg), #2b1055 0%, #7597de 60%, #f4a261 100%);
    color: #ffffff; font-family: "Helvetica Neue", Arial, sans-serif; font-weight: 700;
    line-height: 1.2; text-shadow: 0 0.04em 0.12em rgb(0 0 0 / 55%);
    --k-tamano: max(32px, 7.5cqh);
  }
  .actual, .siguiente { position: absolute; left: 6%; width: 88%; text-align: center; text-wrap: balance; }
  .actual { top: 45%; transform: translateY(-50%); font-size: var(--k-tamano); }
  .siguiente { top: calc(45% + var(--k-tamano) * 1.2); font-size: calc(var(--k-tamano) * 0.7); opacity: 0.9; }
  .barrido { position: relative; display: inline-block; max-width: 100%; }
  .resaltado { position: absolute; inset: 0; color: #ffd166; clip-path: inset(0 100% 0 0); }
  .marca { position: absolute; right: 2%; bottom: 2.5%; font: 600 2.2cqh/1 "Helvetica Neue", Arial, sans-serif;
           color: rgb(255 255 255 / 70%); text-shadow: 0 0 0.2em rgb(0 0 0 / 60%); }
  @keyframes subir { from { transform: translateY(calc(var(--k-tamano) * 1.2)) scale(0.7); } to { transform: translateY(-50%) scale(1); } }
</style>
</head>
<body>
<div class="raiz" id="raiz">
  <div class="actual" id="actual"><span class="barrido"><span id="texto"></span><span class="resaltado" id="res"></span></span></div>
  <div class="siguiente" id="siguiente"></div>
  <div class="marca">Shinobi Karaoke</div>
</div>
<script>
  // Letra inventada: una línea cada 4 s.
  const LINEAS = [
    'Bajo la luna de papel canta el viento',
    'Un ninja silencioso cruza el escenario',
    'Las luces bailan en la pared del bar',
    'Y todos cantan sin mirar la letra',
    'Otra vez desde el principio, más alto'
  ];
  const DURACION_LINEA = 4000;
  let lineaPintada = -1;
  let animacion = null; // animación de entrada controlada por tiempo
  let inicioAnimacionMs = 0;

  function dosFotogramas() {
    return new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
  }

  // Render determinista: todo depende solo de n y fps (nada de reloj de pared).
  window.renderizar = async function (n, fps) {
    const t = (n * 1000) / fps;
    const i = Math.floor(t / DURACION_LINEA) % LINEAS.length;
    const progreso = (t % DURACION_LINEA) / DURACION_LINEA;
    // Fondo en movimiento (peor caso de la fase 5): ángulo función pura del tiempo, periodo 20 s.
    if (location.search.includes('movil')) {
      document.getElementById('raiz').style.setProperty('--angulo', `${(t / 20000) * 360}deg`);
    }
    if (i !== lineaPintada) {
      document.getElementById('texto').textContent = LINEAS[i];
      document.getElementById('res').textContent = LINEAS[i];
      document.getElementById('siguiente').textContent = LINEAS[(i + 1) % LINEAS.length];
      const actual = document.getElementById('actual');
      animacion?.cancel();
      animacion = actual.animate(
        [
          { transform: 'translateY(calc(var(--k-tamano) * 1.2)) scale(0.7)' },
          { transform: 'translateY(-50%) scale(1)' }
        ],
        { duration: 200, easing: 'ease-out', fill: 'both' }
      );
      animacion.pause(); // la mueve el índice de fotograma, no el reloj del documento
      inicioAnimacionMs = t;
      lineaPintada = i;
    }
    if (animacion) animacion.currentTime = Math.min(200, t - inicioAnimacionMs);
    document.getElementById('res').style.clipPath = `inset(0 ${(1 - progreso) * 100}% 0 0)`;
    await dosFotogramas();
    return n;
  };

  window.pintarPrueba = async function () {
    document.getElementById('raiz').style.background = '#ff0000';
    document.getElementById('raiz').style.visibility = 'visible';
    for (const el of document.querySelectorAll('.raiz > *')) el.style.visibility = 'hidden';
    await dosFotogramas();
  };
  window.restaurar = async function () {
    document.getElementById('raiz').style.background = '';
    for (const el of document.querySelectorAll('.raiz > *')) el.style.visibility = '';
    await dosFotogramas();
  };
</script>
</body>
</html>
